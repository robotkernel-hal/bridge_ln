name: C++ CI

on:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps: 
    - name: Setup dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential devscripts debhelper autotools-dev autoconf-archive \
          pkg-config fakeroot sed git tar gzip python3-pip python3-venv curl jq libyaml-cpp-dev \
          g++ scons automake make libtool libdpkg-perl libpython3-dev python3-sphinx python3-dev \
          libproc2-dev libboost-python-dev python3-yaml python3-numpy python3-gi python3-gi-cairo \
          gir1.2-gtk-3.0 gir1.2-vte-2.91 gir1.2-gtksource-4 openssh-client  iproute2
        
    - uses: actions/checkout@v4

    - name: build and install libstring_util
      run: |
        git clone -b 1.2.9 --recursive https://gitlab.com/links_and_nodes/libstring_util
        cd libstring_util
        test -f configure || autoreconf -if
        mkdir -p build
        cd build
        test -f Makefile || ../configure "--prefix=$INSTALL"
        sudo make -j4 install
        
    - name: build links-and-nodes
      shell: bash
      run: |
        git clone -b 2.4.4 --recurse-submodules https://gitlab.com/links_and_nodes/links_and_nodes
        cd links_and_nodes
        scons --use-private-libtomcrypt --write-env 
        sudo scons install

    - name: configure
      run: ./configure
    - name: make
      run: make
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
