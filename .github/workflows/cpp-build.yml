name: C++ CI

on:
  push:

jobs:
  build:

    runs-on: ubuntu-latest

    steps: 
    - name: Setup dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential devscripts debhelper autotools-dev autoconf-archive \
          pkg-config fakeroot sed git tar gzip python3-pip python3-venv curl jq libyaml-cpp-dev \
          g++ scons automake make libtool libdpkg-perl libpython3-dev python3-sphinx python3-dev \
          libproc2-dev libboost-python-dev python3-yaml python3-numpy python3-gi python3-gi-cairo \
          gir1.2-gtk-3.0 gir1.2-vte-2.91 gir1.2-gtksource-4 openssh-client iproute2 libtomcrypt-dev
                
        curl -1sLf 'https://dl.cloudsmith.io/basic/robertburger/robotkernel/setup.deb.sh' | sudo bash
        sudo apt-get update
        sudo apt-get install -y robotkernel-service-helper robotkernel-dev
          
    - uses: actions/checkout@v4

    - name: Build and install libstring_util
      run: |
        git clone -b 1.2.9 --recursive https://gitlab.com/links_and_nodes/libstring_util
        cd libstring_util
        test -f configure || autoreconf -if
        mkdir -p build
        cd build
        test -f Makefile || ../configure "--prefix=/usr"
        sudo make -j4 install
        
    - name: Configure
      run: |
        if [ ! -f configure.ac ]; then
          VERSION=$(echo "${{ github.ref_name }}" | tr '/:' '--')
          sed "s|PACKAGE_VERSION|$VERSION|" configure.ac.in > configure.ac
        fi

        test -f configure || autoreconf -if

        git clone https://github.com/robotkernel-hal/ln_helper.git
        git clone -b 2.4.4 --recurse-submodules https://gitlab.com/links_and_nodes/links_and_nodes

        cd links_and_nodes/libln
        ../python/links_and_nodes_base/ln_generate -o include/ln/client_lib_messages.h --md-dir ../share/message_definitions ln2/request_topic ln/parameters/query ln/parameters/query_dict ln/parameters/override_dict_single ln/parameters/request_parameter_topic ln/event/call ln/event/connect ln/log_service
        python3 ./scripts/generate_ln_errors_h include/ln/ln.h include/ln/errors.h
        for f in src/*.c; do echo compiling $f; gcc $f -fPIC -Iinclude -Isrc -c -D__LINUX__ -DLTM_DESC -DUSE_LTM ; done
        echo compiling src/sharedlnclient.cpp; g++ -fPIC src/sharedlnclient.cpp  -Iinclude -Isrc -c -D__LINUX__ -DLTM_DESC -DUSE_LTM
        echo creating libln.a; ar cr libln.a *.o
        cd ../..
        
        LINKS_AND_NODES_CFLAGS="-I$(pwd)/links_and_nodes/libln/include" LINKS_AND_NODES_LIBS="$(pwd)/links_and_nodes/libln/libln.a" \
        LN_HELPER_CFLAGS="-I$(pwd)/ln_helper/src/main/cpp" LN_HELPER_LIBS=" " \
        ./configure
        
    - name: make
      run: make
      
    - name: make check
      run: make check
    - name: make distcheck
      run: make distcheck
